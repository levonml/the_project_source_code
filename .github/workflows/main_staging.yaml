name: Build and publish applicationo on Staging

on:
  push:
    branches:
      - main

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    environment: The-project

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag image with the GitHub SHA to get a unique tag
      - name: Build and publish backend
        run: |-
          docker build --tag "levonml/4-10-the-project-staging:$GITHUB_SHA" ./base/the_project
          docker push "levonml/4-10-the-project-staging:$GITHUB_SHA"
          docker build -f ./base/todo-backend/Dockerfile.staging --tag "levonml/4-10-todo-backend-staging:$GITHUB_SHA" ./base/todo-backend
          docker push "levonml/4-10-todo-backend-staging:$GITHUB_SHA"

