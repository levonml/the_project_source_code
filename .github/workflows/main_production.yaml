name: Build and publish application on Production

on:
  push:
    tags:
      - '*'

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    environment: The-project

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag image with the GitHub SHA to get a unique tag
      - name: Build and publish backend
        run: |-
          docker build --tag "levonml/4-10-the-project:$GITHUB_SHA" ./base/the_project
          docker push "levonml/4-10-the-project:$GITHUB_SHA"
          docker build --tag "levonml/4-10-todo-backend:$GITHUB_SHA" ./base/todo-backend
          docker push "levonml/4-10-todo-backend:$GITHUB_SHA"
          docker build --tag "levonml/4-10-broadcaster:$GITHUB_SHA" ./components/broadcaster
          docker push "levonml/4-10-broadcaster:$GITHUB_SHA"

